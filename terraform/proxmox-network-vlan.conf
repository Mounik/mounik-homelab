# VLAN Proxmox - Configuration réseau
# Ce fichier est un template pour /etc/network/interfaces sur chaque nœud Proxmox
# Adapter les IPs et le nom d'interface physique selon le nœud

auto lo
iface lo inet loopback

# Interface physique vers le switch Freebox
# Adapter eno1 / eth0 selon le nœud
auto eno1
iface eno1 inet manual

# Bridge principal avec VLAN trunk
auto vmbr0
iface vmbr0 inet static
    address 192.168.1.{{ pve_ip_suffix }}/24
    gateway 192.168.1.254
    bridge-ports eno1
    bridge-stp off
    bridge-fd 0

# VLAN 10 - Management (SSH, Proxmox API)
auto vmbr0.10
iface vmbr0.10 inet static
    address 192.168.10.{{ pve_ip_suffix }}/24
    vlan-raw-device vmbr0

# VLAN 20 - Infrastructure (Traefik, Authentik, Vaultwarden, monitoring)
auto vmbr0.20
iface vmbr0.20 inet static
    address 192.168.20.{{ pve_ip_suffix }}/24
    vlan-raw-device vmbr0

# VLAN 30 - Applications (Paperless, Immich, Nextcloud, Mealie)
auto vmbr0.30
iface vmbr0.30 inet static
    address 192.168.30.{{ pve_ip_suffix }}/24
    vlan-raw-device vmbr0

# VLAN 40 - IA (Ollama, LangGraph, n8n)
auto vmbr0.40
iface vmbr0.40 inet static
    address 192.168.40.{{ pve_ip_suffix }}/24
    vlan-raw-device vmbr0
