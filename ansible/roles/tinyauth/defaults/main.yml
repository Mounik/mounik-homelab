---
# Defaults - TinyAuth

tinyauth_domain: "tinyauth.mounik.ovh"
tinyauth_app_title: "Mounik Lab"
tinyauth_log_level: "info"

# Utilisateurs (séparer par ; pour plusieurs)
# Format: nom_utilisateur:hash_bcrypt
# Générer avec: mkpasswd --method=bcrypt
tinyauth_users: ""

# OAuth (optionnel)
tinyauth_oauth_github_enabled: false
tinyauth_oauth_github_client_id: ""
tinyauth_oauth_github_client_secret: ""
tinyauth_oauth_whitelist: ""

# ACL par défaut: aucun (laisser vide = tous les utilisateurs autorisés)
tinyauth_default_acl: ""
