---
# Role: k3s - Installation et configuration du cluster Kubernetes

# --- Prérequis ---
- name: Installer les dépendances k3s
  apt:
    name:
      - iptables
      - arptables
      - ebtables
      - socat
      - ipset
      - open-iscsi
      - nfs-common
      - conntrack
    state: present
    update_cache: yes

- name: Désactiver le swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Supprimer le swap de fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent

# --- Configuration réseau ---
- name: Activer le forwarding IP
  sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    reload: yes
  loop:
    - net.ipv4.ip_forward
    - net.bridge.bridge-nf-call-iptables

# --- Installation k3s Server (premier nœud) ---
- name: Installer k3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
      --tls-san={{ k3s_server_ip }} \
      --tls-san=k3s.mounik.ovh \
      --node-name={{ inventory_hostname }} \
      --token={{ k3s_token }} \
      --write-kubeconfig-mode=644
  args:
    creates: /usr/local/bin/k3s
  when: k3s_role == 'server'

# --- Installation k3s Agent (nœuds suivants) ---
- name: Installer k3s agent
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - agent \
      --server=https://{{ k3s_server_ip }}:6443 \
      --token={{ k3s_token }} \
      --node-name={{ inventory_hostname }}
  args:
    creates: /usr/local/bin/k3s
  when: k3s_role == 'agent'

# --- Configuration kubectl ---
- name: Créer le répertoire .kube
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Copier la config kubectl
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  when: k3s_role == 'server'

# --- Installation kubectl (agents) ---
- name: Installer kubectl
  shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    rm kubectl
  args:
    creates: /usr/local/bin/kubectl
  when: k3s_role == 'agent'

- name: Copier la config kubectl pour les agents
  copy:
    src: "/etc/rancher/k3s/k3s.yaml"
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  delegate_to: "{{ groups['k3s_server'][0] }}"
  when: k3s_role == 'agent'

# --- Installation Helm ---
- name: Installer Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

# --- Installation Longhorn (storage) ---
- name: Ajouter le repo Helm Longorn
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"
  when: k3s_role == 'server'

- name: Installer Longhorn
  kubernetes.core.helm:
    name: longhorn
    namespace: longhorn-system
    chart_ref: longhorn/longhorn
    create_namespace: yes
    values:
      defaultSettings:
        defaultReplicaCount: 2
        defaultDataLocality: "best-effort"
  when: k3s_role == 'server'

# --- Installation MetalLB (LoadBalancer) ---
- name: Ajouter le repo Helm MetalLB
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: "https://metallb.github.io/metallb"
  when: k3s_role == 'server'

- name: Installer MetalLB
  kubernetes.core.helm:
    name: metallb
    namespace: metallb-system
    chart_ref: metallb/metallb
    create_namespace: yes
  when: k3s_role == 'server'

# --- Déployer les manifests de base ---
- name: Créer le répertoire manifests
  file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
  when: k3s_role == 'server'

- name: Déployer l'IPPool MetalLB
  template:
    src: metallb-ip-pool.yml.j2
    dest: /var/lib/rancher/k3s/server/manifests/metallb-ip-pool.yaml
  when: k3s_role == 'server'
