---
# Playbook principal - mounik-homelab
# Usage: ansible-playbook -i inventory.yml playbook.yml

# =============================================================================
# ÉTAPE 1: Configuration de base (toutes les VMs)
# =============================================================================
- name: Configuration de base de toutes les VMs
  hosts: all
  become: yes
  roles:
    - role: base
      tags: [base]

# =============================================================================
# ÉTAPE 2: Docker (VMs non-K8s)
# =============================================================================
- name: Installation Docker sur les VMs Docker
  hosts: infrastructure:personal-cloud:ai
  become: yes
  roles:
    - role: docker
      tags: [docker]

# =============================================================================
# ÉTAPE 3: Cluster k3s
# =============================================================================
- name: Installation k3s Server
  hosts: k3s_server
  become: yes
  roles:
    - role: k3s
      tags: [k3s, k8s]
  vars:
    k3s_role: server

- name: Installation k3s Agents
  hosts: k3s_agents
  become: yes
  roles:
    - role: k3s
      tags: [k3s, k8s]
  vars:
    k3s_role: agent

# =============================================================================
# ÉTAPE 4: Applications Kubernetes
# =============================================================================
- name: Déploiement GitLab CE sur K8s
  hosts: k3s_server[0]
  become: yes
  roles:
    - role: gitlab-ce
      tags: [gitlab, k8s]
  vars:
    ansible_become: no  # kubectl already accessible

- name: Déploiement ArgoCD sur K8s
  hosts: k3s_server[0]
  become: yes
  roles:
    - role: argocd
      tags: [argocd, k8s]
  vars:
    ansible_become: no

- name: Déploiement Harbor sur K8s
  hosts: k3s_server[0]
  become: yes
  roles:
    - role: harbor
      tags: [harbor, k8s]
  vars:
    ansible_become: no

# =============================================================================
# ÉTAPE 5: Infrastructure pve01 (Docker)
# =============================================================================
- name: Configuration Infrastructure (pve01)
  hosts: infrastructure
  become: yes
  roles:
    - role: traefik
      tags: [traefik, infra]
      when: role == 'traefik'
    - role: crowdsec
      tags: [crowdsec, security, infra]
      when: role == 'traefik'
    - role: tinyauth
      tags: [tinyauth, auth, infra]
      when: role == 'traefik'

# =============================================================================
# ÉTAPE 6: Sécurité (toutes les VMs)
# =============================================================================
- name: Firewall et mises à jour de sécurité
  hosts: all
  become: yes
  roles:
    - role: firewall
      tags: [firewall, security]
    - role: security-updates
      tags: [security-updates, security]
