---
# Playbook principal - mounik-homelab
# Usage: ansible-playbook -i inventory-generated.yml playbook.yml

# --- Configuration de base (toutes les VMs) ---
- name: Configuration de base de toutes les VMs
  hosts: all
  become: yes
  roles:
    - role: base
      tags: [base]

# --- Docker (toutes les VMs) ---
- name: Installation Docker sur toutes les VMs
  hosts: all
  become: yes
  roles:
    - role: docker
      tags: [docker]

# --- Infrastructure pve01 ---
- name: Configuration Infrastructure (pve01)
  hosts: infrastructure
  become: yes
  roles:
    - role: traefik
      tags: [traefik, infra]
      when: "'traefik' in inventory_hostname"
    - role: crowdsec
      tags: [crowdsec, security, infra]
      when: "'traefik' in inventory_hostname"
    - role: tinyauth
      tags: [tinyauth, auth, infra]
      when: "'traefik' in inventory_hostname"
    # Décommenter pour migration vers Authentik:
    # - role: authentik
    #   tags: [authentik, auth, infra]
    #   when: "'traefik' in inventory_hostname"

# --- Sécurité (toutes les VMs) ---
- name: Firewall et mises à jour de sécurité
  hosts: all
  become: yes
  roles:
    - role: firewall
      tags: [firewall, security]
    - role: security-updates
      tags: [security-updates, security]
